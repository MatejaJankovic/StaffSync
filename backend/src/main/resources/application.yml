spring:
  application:
    name: staffsync-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/staffsync}
    username: ${DB_USER:staffsync}
    password: ${DB_PASSWORD:staffsync}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

staffsync:
  jwt:
    # Must be at least 32 characters (HS256). Override with JWT_SECRET outside local dev.
    secret: ${JWT_SECRET:staffsync-local-dev-jwt-secret-change-me-0123456789}
    expiration: 8h
