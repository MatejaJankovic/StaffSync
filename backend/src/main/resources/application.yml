spring:
  application:
    name: staffsync-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/staffsync}
    username: ${DB_USER:staffsync}
    password: ${DB_PASSWORD:staffsync}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

staffsync:
  jwt:
    # Must be at least 32 characters (HS256). No default on purpose: without JWT_SECRET the
    # app fails at startup. The dev profile (application-dev.yml) provides one for local use.
    secret: ${JWT_SECRET:}
    expiration: 8h
