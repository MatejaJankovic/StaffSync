spring:
  application:
    name: staffsync-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/staffsync}
    username: ${DB_USER:staffsync}
    password: ${DB_PASSWORD:staffsync}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        # Every Page<T> is returned as { content, page: { size, number, totalElements, totalPages } }
        serialization-mode: via-dto
        max-page-size: 100

server:
  port: 8080

springdoc:
  swagger-ui:
    # Keeps the token from Authorize across a reload of the Swagger page
    persist-authorization: true

staffsync:
  jwt:
    # Must be at least 32 characters (HS256). No default on purpose: without JWT_SECRET the
    # app fails at startup. The dev profile (application-dev.yml) provides one for local use.
    secret: ${JWT_SECRET:}
    expiration: 8h
