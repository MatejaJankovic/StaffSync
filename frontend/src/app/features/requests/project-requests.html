@if (canChange()) {
  <div class="project-requests__toolbar">
    <a ss-button="filled" [routerLink]="newRequestLink()">
      <ss-icon>add</ss-icon>
      New request
    </a>
  </div>
}

<app-paged-table
  [columns]="columns"
  [fetch]="fetch()"
  [emptyText]="emptyText()"
  [pageSize]="10"
  clickableRows
  (rowClick)="open($event)"
>
  <ng-template appPagedTableCell="status" let-row>
    <app-status-chip [status]="row.status" />
  </ng-template>

  <ng-template appPagedTableCell="actions" let-row>
    <!-- The row opens the details, so a click on an action must not reach it -->
    <div class="project-requests__actions">
      @if (canFindCandidates(row)) {
        <a ss-button [routerLink]="candidatesLink(row)" (click)="$event.stopPropagation()">
          <ss-icon>person_search</ss-icon>
          Find candidates
        </a>
      }
      @if (canEdit(row)) {
        <a
          ss-button="icon"
          [routerLink]="editLink(row)"
          [attr.aria-label]="'Edit ' + row.title"
          (click)="$event.stopPropagation()"
        >
          <ss-icon>edit</ss-icon>
        </a>
      }
      @if (canCancel(row)) {
        <button
          ss-button="icon"
          type="button"
          [attr.aria-label]="'Cancel ' + row.title"
          (click)="$event.stopPropagation(); cancel(row)"
        >
          <ss-icon>cancel</ss-icon>
        </button>
      }
    </div>
  </ng-template>
</app-paged-table>
