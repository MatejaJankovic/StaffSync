<section class="users">
  <header class="users__header">
    <h1>Users</h1>
    <button mat-flat-button (click)="create()">
      <mat-icon>person_add</mat-icon>
      Create user
    </button>
  </header>

  <div class="users__filters">
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Department</mat-label>
      <mat-select [value]="departmentId()" (selectionChange)="departmentId.set($event.value)">
        <mat-option value="">All departments</mat-option>
        @for (department of departments(); track department.id) {
          <mat-option [value]="department.id">{{ department.name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Role</mat-label>
      <mat-select [value]="role()" (selectionChange)="role.set($event.value)">
        <mat-option value="">All roles</mat-option>
        @for (option of roles; track option) {
          <mat-option [value]="option">{{ roleLabels[option] }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Status</mat-label>
      <mat-select [value]="active()" (selectionChange)="active.set($event.value)">
        <mat-option value="active">Active</mat-option>
        <mat-option value="inactive">Inactive</mat-option>
        <mat-option value="">All</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <app-paged-table [columns]="columns" [fetch]="fetch()" emptyText="No users match the filters.">
    <ng-template appPagedTableCell="active" let-row>
      <app-status-chip [status]="row.active ? 'ACTIVE' : 'INACTIVE'" />
    </ng-template>
    <ng-template appPagedTableCell="actions" let-row>
      <span class="users__actions">
        <button
          mat-icon-button
          [attr.aria-label]="'Edit ' + row.firstName + ' ' + row.lastName"
          (click)="edit(row)"
        >
          <mat-icon>edit</mat-icon>
        </button>
        @if (canDeactivate(row)) {
          <button
            mat-icon-button
            [attr.aria-label]="'Deactivate ' + row.firstName + ' ' + row.lastName"
            (click)="deactivate(row)"
          >
            <mat-icon>person_off</mat-icon>
          </button>
        }
      </span>
    </ng-template>
  </app-paged-table>
</section>
