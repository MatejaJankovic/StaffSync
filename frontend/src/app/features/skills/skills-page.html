<section class="skills">
  <header class="skills__header">
    <h1>Skills catalog</h1>
    <button mat-flat-button (click)="add()">
      <mat-icon>add</mat-icon>
      Add skill
    </button>
  </header>

  @if (loading()) {
    <p class="skills__message">Loading skills…</p>
  } @else if (loadFailed()) {
    <p class="skills__message" role="alert">
      Unable to load the skills.
      <button mat-button (click)="load()">Retry</button>
    </p>
  } @else if (groups().length === 0) {
    <p class="skills__message">The catalog is empty. Add the first skill.</p>
  } @else {
    @for (group of groups(); track group.category) {
      <h2 class="skills__category">{{ group.label }}</h2>
      <table mat-table [dataSource]="group.skills" class="skills__table">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let skill">{{ skill.name }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="skills__actions"></th>
          <td mat-cell *matCellDef="let skill" class="skills__actions">
            <button mat-icon-button [attr.aria-label]="'Edit ' + skill.name" (click)="edit(skill)">
              <mat-icon>edit</mat-icon>
            </button>
            <button
              mat-icon-button
              [attr.aria-label]="'Delete ' + skill.name"
              (click)="remove(skill)"
            >
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let row; columns: columns"></tr>
      </table>
    }
  }
</section>
