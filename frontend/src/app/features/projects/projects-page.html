<section class="projects ss-page">
  <header class="ss-page-header projects__header">
    <div>
      <p class="ss-eyebrow">Project manager</p>
      <h1>My projects</h1>
      <p class="ss-page-context">The projects you manage, with their client, period and status.</p>
    </div>
    <button ss-button="filled" (click)="create()">
      <ss-icon>add</ss-icon>
      New project
    </button>
  </header>

  <div class="projects__toolbar">
    <ss-field class="projects__filter">
      <ss-label>Status</ss-label>
      <ss-select [value]="status()" (selectionChange)="status.set($event.value)">
        <ss-option value="">All statuses</ss-option>
        @for (option of statuses; track option) {
          <ss-option [value]="option">{{ statusLabels[option] }}</ss-option>
        }
      </ss-select>
    </ss-field>
  </div>

  <app-paged-table
    [columns]="columns"
    [fetch]="fetch()"
    [emptyText]="emptyText()"
    clickableRows
    (rowClick)="open($event)"
  >
    <ng-template appPagedTableCell="name" let-row>
      <a
        class="projects__name"
        [routerLink]="['/projects', row.id]"
        (click)="$event.stopPropagation()"
        >{{ row.name }}</a
      >
    </ng-template>
    <ng-template appPagedTableCell="status" let-row>
      <app-status-chip [status]="row.status" />
    </ng-template>
    <ng-template appPagedTableCell="actions" let-row>
      @if (isEditable(row)) {
        <button
          ss-button="icon"
          [attr.aria-label]="'Edit ' + row.name"
          (click)="$event.stopPropagation(); edit(row)"
        >
          <ss-icon>edit</ss-icon>
        </button>
      }
    </ng-template>
  </app-paged-table>
</section>
