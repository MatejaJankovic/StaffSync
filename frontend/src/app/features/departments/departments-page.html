<section class="departments ss-page">
  <header class="ss-page-header">
    <div class="departments__title">
      <p class="ss-eyebrow">Admin</p>
      <h1>Departments</h1>
      <p class="ss-page-context">The teams that people belong to.</p>
    </div>
    <button ss-button="filled" (click)="add()">
      <ss-icon>add</ss-icon>
      Add department
    </button>
  </header>

  @if (loading()) {
    <p class="departments__message" role="status">Loading departments…</p>
  } @else if (loadFailed()) {
    <p class="departments__message" role="alert">
      Unable to load the departments.
      <button ss-button="outlined" type="button" (click)="load()">Retry</button>
    </p>
  } @else if (departments().length === 0) {
    <p class="departments__message">There are no departments yet. Add the first one.</p>
  } @else {
    <div class="departments__panel">
      <table cdk-table class="ss-table departments__table" [dataSource]="departments()">
        <ng-container cdkColumnDef="name">
          <th cdk-header-cell *cdkHeaderCellDef>Name</th>
          <td cdk-cell *cdkCellDef="let department">{{ department.name }}</td>
        </ng-container>

        <ng-container cdkColumnDef="actions">
          <th cdk-header-cell *cdkHeaderCellDef class="departments__actions"></th>
          <td cdk-cell *cdkCellDef="let department" class="departments__actions">
            <button
              ss-button="icon"
              [attr.aria-label]="'Rename ' + department.name"
              [attr.title]="'Rename ' + department.name"
              (click)="rename(department)"
            >
              <ss-icon>edit</ss-icon>
            </button>
            <button
              ss-button="icon"
              [attr.aria-label]="'Delete ' + department.name"
              [attr.title]="'Delete ' + department.name"
              (click)="remove(department)"
            >
              <ss-icon>delete</ss-icon>
            </button>
          </td>
        </ng-container>

        <tr cdk-header-row *cdkHeaderRowDef="columns"></tr>
        <tr cdk-row *cdkRowDef="let row; columns: columns"></tr>
      </table>
    </div>
  }
</section>
