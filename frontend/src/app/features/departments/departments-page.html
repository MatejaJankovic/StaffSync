<section class="departments">
  <header class="departments__header">
    <h1>Departments</h1>
    <button mat-flat-button (click)="add()">
      <mat-icon>add</mat-icon>
      Add department
    </button>
  </header>

  @if (loading()) {
    <p class="departments__message">Loading departments…</p>
  } @else if (loadFailed()) {
    <p class="departments__message" role="alert">
      Unable to load the departments.
      <button mat-button (click)="load()">Retry</button>
    </p>
  } @else if (departments().length === 0) {
    <p class="departments__message">There are no departments yet. Add the first one.</p>
  } @else {
    <table mat-table [dataSource]="departments()" class="departments__table">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let department">{{ department.name }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="departments__actions"></th>
        <td mat-cell *matCellDef="let department" class="departments__actions">
          <button
            mat-icon-button
            [attr.aria-label]="'Rename ' + department.name"
            (click)="rename(department)"
          >
            <mat-icon>edit</mat-icon>
          </button>
          <button
            mat-icon-button
            [attr.aria-label]="'Delete ' + department.name"
            (click)="remove(department)"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
    </table>
  }
</section>
