<div class="paged-table">
  <div class="paged-table__progress">
    @if (loading()) {
      <mat-progress-bar mode="indeterminate" aria-label="Loading" />
    }
  </div>

  <div class="paged-table__scroll">
    <table mat-table [dataSource]="rows()" matSort (matSortChange)="sort.set($event)">
      @for (column of columns(); track column.key) {
        <ng-container [matColumnDef]="column.key">
          <th mat-header-cell *matHeaderCellDef mat-sort-header [disabled]="!column.sortable">
            {{ column.header }}
          </th>
          <td mat-cell *matCellDef="let row">
            @if (cellTemplates().get(column.key); as template) {
              <ng-container *ngTemplateOutlet="template; context: { $implicit: row }" />
            } @else {
              {{ cellValue(column, row) }}
            }
          </td>
        </ng-container>
      }

      <tr mat-header-row *matHeaderRowDef="columnKeys()"></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: columnKeys()"
        [class.paged-table__row--clickable]="clickableRows()"
        (click)="rowClick.emit(row)"
      ></tr>
      <tr class="mat-mdc-row" *matNoDataRow>
        <td class="mat-mdc-cell paged-table__empty" [attr.colspan]="columnKeys().length">
          {{ loading() ? 'Loading…' : failed() ? 'Unable to load the data' : emptyText() }}
        </td>
      </tr>
    </table>
  </div>

  <mat-paginator
    [length]="total()"
    [pageIndex]="pageIndex()"
    [pageSize]="size()"
    [pageSizeOptions]="pageSizeOptions()"
    (page)="onPage($event)"
    showFirstLastButtons
  />
</div>
