<div class="paged-table">
  <div class="paged-table__progress">
    @if (loading()) {
      <ss-progress-bar mode="indeterminate" aria-label="Loading" />
    }
  </div>

  <div class="paged-table__scroll">
    <table
      cdk-table
      class="ss-table"
      [dataSource]="rows()"
      ssSort
      (ssSortChange)="sort.set($event)"
    >
      @for (column of columns(); track column.key) {
        <ng-container [cdkColumnDef]="column.key">
          <th
            cdk-header-cell
            *cdkHeaderCellDef
            ss-sort-header
            [disabled]="!column.sortable"
            [class.ss-num]="column.numeric"
          >
            {{ column.header }}
          </th>
          <td cdk-cell *cdkCellDef="let row" [class.ss-num]="column.numeric">
            @if (cellTemplates().get(column.key); as template) {
              <ng-container *ngTemplateOutlet="template; context: { $implicit: row }" />
            } @else {
              {{ cellValue(column, row) }}
            }
          </td>
        </ng-container>
      }

      <tr cdk-header-row *cdkHeaderRowDef="columnKeys()"></tr>
      <tr
        cdk-row
        class="paged-table__row"
        *cdkRowDef="let row; columns: columnKeys()"
        [class.paged-table__row--clickable]="clickableRows()"
        (click)="clickableRows() && rowClick.emit(row)"
      ></tr>
      <tr class="paged-table__empty-row" *cdkNoDataRow>
        <td class="paged-table__empty" [attr.colspan]="columnKeys().length">
          {{ loading() ? 'Loading…' : failed() ? 'Unable to load the data' : emptyText() }}
        </td>
      </tr>
    </table>
  </div>

  <ss-paginator
    [length]="total()"
    [pageIndex]="pageIndex()"
    [pageSize]="size()"
    [pageSizeOptions]="pageSizeOptions()"
    (page)="onPage($event)"
    showFirstLastButtons
  />
</div>
